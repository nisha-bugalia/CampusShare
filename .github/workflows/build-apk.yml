name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - release
          - both

jobs:
  build-apk:
    name: Build Android APK (${{ github.event.inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 4. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Expo CLI ──────────────────────────────────────────────────────
      - name: Install Expo CLI
        run: npm install -g expo@latest

      # ── 6. Inject env vars ───────────────────────────────────────────────
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> .env

      # ── 7. Expo Prebuild ─────────────────────────────────────────────────
      - name: Expo Prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # ── 8. Android SDK ────────────────────────────────────────────────────
      - name: Accept Android SDK licenses & install build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # ── 9. Gradle permissions ────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10a. Build Development APK ────────────────────────────────────────
      # Runs when: build_type = development | both | (no input = push to master)
      - name: Build Development APK (Debug)
        if: >
          github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.build_type == 'development' ||
           github.event.inputs.build_type == 'both')
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # ── 10b. Build Release APK ────────────────────────────────────────────
      # Runs when: build_type = release | both | triggered by push (no input)
      - name: Build Release APK
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           (github.event.inputs.build_type == 'release' ||
            github.event.inputs.build_type == 'both'))
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # ── 11. Locate & rename APKs ─────────────────────────────────────────
      - name: Find and rename APKs
        run: |
          echo "=== All APK files found ==="
          find android/app/build/outputs/apk/ -name "*.apk" 2>/dev/null || echo "No APKs built yet"

          # Dev APK
          DEV_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$DEV_APK" ]; then
            cp "$DEV_APK" "CampusShare-Dev-v${{ github.run_number }}.apk"
            echo "DEV_APK_EXISTS=true" >> $GITHUB_ENV
            echo "✅ Dev APK: $DEV_APK"
          else
            echo "DEV_APK_EXISTS=false" >> $GITHUB_ENV
          fi

          # Release APK
          REL_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$REL_APK" ]; then
            cp "$REL_APK" "CampusShare-Release-v${{ github.run_number }}.apk"
            echo "REL_APK_EXISTS=true" >> $GITHUB_ENV
            echo "✅ Release APK: $REL_APK"
          else
            echo "REL_APK_EXISTS=false" >> $GITHUB_ENV
          fi

      # ── 12a. Upload Development APK ───────────────────────────────────────
      - name: Upload Development APK artifact
        if: env.DEV_APK_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CampusShare-Dev-v${{ github.run_number }}
          path: CampusShare-Dev-v${{ github.run_number }}.apk
          retention-days: 14

      # ── 12b. Upload Release APK ───────────────────────────────────────────
      - name: Upload Release APK artifact
        if: env.REL_APK_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CampusShare-Release-v${{ github.run_number }}
          path: CampusShare-Release-v${{ github.run_number }}.apk
          retention-days: 30

      # ── 13. Build Summary ─────────────────────────────────────────────────
      - name: Print build summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Status | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          if [ "$DEV_APK_EXISTS" = "true" ]; then
            echo "| 🛠️ Development | ✅ Built | \`CampusShare-Dev-v${{ github.run_number }}.apk\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📱 Using Your Dev APK" >> $GITHUB_STEP_SUMMARY
            echo "1. Download \`CampusShare-Dev-v${{ github.run_number }}.apk\` from the Artifacts panel" >> $GITHUB_STEP_SUMMARY
            echo "2. Install it on your Android phone (once)" >> $GITHUB_STEP_SUMMARY
            echo "3. On your PC, run: \`npx expo start\`" >> $GITHUB_STEP_SUMMARY
            echo "4. Scan the QR code or enter your IP — changes will live reload instantly!" >> $GITHUB_STEP_SUMMARY
            echo "5. Use \`npx expo start --tunnel\` if phone and PC are on different networks" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$REL_APK_EXISTS" = "true" ]; then
            echo "| 📦 Release | ✅ Built | \`CampusShare-Release-v${{ github.run_number }}.apk\` |" >> $GITHUB_STEP_SUMMARY
          fi
