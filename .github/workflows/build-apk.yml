name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 4. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Expo CLI ──────────────────────────────────────────────────────
      - name: Install Expo CLI
        run: npm install -g expo@latest

      # ── 6. Inject env vars ───────────────────────────────────────────────
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> .env

      # ── 7. Expo Prebuild ─────────────────────────────────────────────────
      - name: Expo Prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # ── 8. Android SDK (use pre-installed SDK on ubuntu-latest) ──────────
      # NOTE: ubuntu-latest already has Android SDK at $ANDROID_HOME.
      # We skip android-actions/setup-android which conflicts with it.
      # We just accept licenses and ensure required build tools are present.
      - name: Accept Android SDK licenses & install build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Find sdkmanager — it may be in cmdline-tools/latest or cmdline-tools/12.0
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # ── 9. Gradle permissions ────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Build Release APK ─────────────────────────────────────────────
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # ── 11. Locate APK ────────────────────────────────────────────────────
      - name: Find APK path
        run: |
          find android/app/build/outputs/apk/ -name "*.apk"
          echo "APK_PATH=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" >> $GITHUB_ENV

      # ── 12. Rename APK ────────────────────────────────────────────────────
      - name: Rename APK
        run: cp "$APK_PATH" "CampusShare-v${{ github.run_number }}.apk"

      # ── 13. Upload as downloadable artifact ───────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusShare-APK-v${{ github.run_number }}
          path: CampusShare-v${{ github.run_number }}.apk
          retention-days: 30
