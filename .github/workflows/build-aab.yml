name: Build Android Production AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android Version Code (leave empty to use app.json versionCode)"
        required: false
        default: ""
        type: string

jobs:
  build-aab:
    name: Build Signed Android App Bundle (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 4. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Expo CLI ──────────────────────────────────────────────────────
      - name: Install Expo CLI
        run: npm install -g expo@latest

      # ── 6. Inject Supabase env vars ──────────────────────────────────────
      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> .env

      # ── 7. Expo Prebuild ─────────────────────────────────────────────────
      - name: Expo Prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # ── 8. Android SDK ────────────────────────────────────────────────────
      - name: Accept Android SDK licenses & install build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # ── 9. Validate & Decode Keystore ─────────────────────────────────────
      - name: Decode Production Keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Missing secret 'ANDROID_KEYSTORE_BASE64'. Please add your base64-encoded release keystore to GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Missing secret 'ANDROID_KEYSTORE_PASSWORD'."
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "::error::Missing secret 'ANDROID_KEY_ALIAS'."
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::Missing secret 'ANDROID_KEY_PASSWORD'."
            exit 1
          fi

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          echo "Keystore successfully decoded to android/app/release.keystore"

      # ── 10. Extract upload keystore SHA1 for later verification ────────────
      - name: Extract upload keystore certificate SHA1
        run: |
          UPLOAD_SHA1=$(keytool -list -v \
            -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" 2>/dev/null \
            | grep "SHA1:" | head -1 | sed 's/.*SHA1: *//' | tr -d ' ')
          if [ -z "$UPLOAD_SHA1" ]; then
            echo "::error::Could not extract SHA1 from upload keystore. Check ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "Upload keystore SHA1: $UPLOAD_SHA1"
          echo "UPLOAD_KEYSTORE_SHA1=$UPLOAD_SHA1" >> $GITHUB_ENV
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # ── 11. Configure Release Signing in build.gradle ────────────────────
      #
      # ROOT CAUSE OF PREVIOUS BUG:
      # The Expo CNG template build.gradle has TWO occurrences of
      # "signingConfig signingConfigs.debug" inside the buildTypes block:
      # one in debug{} and one in release{}. The old code used
      # match.replace("signingConfig signingConfigs.debug", "...")
      # which is a plain-string replace that only changes the FIRST
      # occurrence — the debug buildType — leaving the release buildType
      # still pointing at signingConfigs.debug.
      #
      # FIX: Use a single literal string match-and-replace that covers
      # both the signingConfigs and buildTypes blocks together, so each
      # buildType gets the correct signingConfig without any ambiguity.
      #
      - name: Configure Release Signing in android/app/build.gradle
        run: |
          node << 'PATCH_SCRIPT'
          const fs = require("fs");
          const gradlePath = "android/app/build.gradle";
          let content = fs.readFileSync(gradlePath, "utf8");

          // Normalize line endings
          content = content.replace(/\r\n/g, "\n");

          // The exact block produced by Expo CNG prebuild (SDK 57)
          const target = [
            "    signingConfigs {",
            "        debug {",
            "            storeFile file('debug.keystore')",
            "            storePassword 'android'",
            "            keyAlias 'androiddebugkey'",
            "            keyPassword 'android'",
            "        }",
            "    }",
            "    buildTypes {",
            "        debug {",
            "            signingConfig signingConfigs.debug",
            "        }",
            "        release {",
            "            // Caution! In production, you need to generate your own keystore file.",
            "            // see https://reactnative.dev/docs/signed-apk-android.",
            "            signingConfig signingConfigs.debug"
          ].join("\n");

          const replacement = [
            "    signingConfigs {",
            "        debug {",
            "            storeFile file('debug.keystore')",
            "            storePassword 'android'",
            "            keyAlias 'androiddebugkey'",
            "            keyPassword 'android'",
            "        }",
            "        release {",
            "            storeFile file('release.keystore')",
            "            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')",
            "            keyAlias System.getenv('ANDROID_KEY_ALIAS')",
            "            keyPassword System.getenv('ANDROID_KEY_PASSWORD')",
            "        }",
            "    }",
            "    buildTypes {",
            "        debug {",
            "            signingConfig signingConfigs.debug",
            "        }",
            "        release {",
            "            signingConfig signingConfigs.release"
          ].join("\n");

          if (!content.includes(target)) {
            console.error("FATAL: Expected Expo CNG signing/buildTypes block not found in build.gradle.");
            console.error("The template may have changed. Manual inspection required.");
            process.exit(1);
          }

          content = content.replace(target, replacement);

          // Optional: Override versionCode if provided via workflow_dispatch input
          const customVersionCode = process.env.INPUT_VERSION_CODE || "";
          if (customVersionCode) {
            console.log("Overriding versionCode with custom input:", customVersionCode);
            content = content.replace(/versionCode\s+\d+/, "versionCode " + customVersionCode);
          }

          fs.writeFileSync(gradlePath, content, "utf8");

          // ── Post-patch validation ──
          const patched = fs.readFileSync(gradlePath, "utf8");

          // Verify signingConfigs.release exists with env vars
          if (!patched.includes("System.getenv('ANDROID_KEYSTORE_PASSWORD')")) {
            console.error("FATAL: signingConfigs.release missing ANDROID_KEYSTORE_PASSWORD after patch.");
            process.exit(1);
          }

          // Verify release buildType uses signingConfigs.release
          const btBlock = patched.match(/buildTypes\s*\{([\s\S]*?)\n    \}/);
          if (!btBlock) {
            console.error("FATAL: buildTypes block not found after patch.");
            process.exit(1);
          }
          const btBody = btBlock[1];

          const debugBt = btBody.match(/debug\s*\{[\s\S]*?signingConfig\s+(\S+)/);
          const releaseBt = btBody.match(/release\s*\{[\s\S]*?signingConfig\s+(\S+)/);

          if (!debugBt || debugBt[1] !== "signingConfigs.debug") {
            console.error("FATAL: debug buildType is NOT using signingConfigs.debug! Found:", debugBt ? debugBt[1] : "none");
            process.exit(1);
          }
          if (!releaseBt || releaseBt[1] !== "signingConfigs.release") {
            console.error("FATAL: release buildType is NOT using signingConfigs.release! Found:", releaseBt ? releaseBt[1] : "none");
            process.exit(1);
          }

          console.log("✅ build.gradle patched and validated successfully.");
          console.log("   debug  buildType → signingConfigs.debug");
          console.log("   release buildType → signingConfigs.release");
          PATCH_SCRIPT
        env:
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}

      # ── 12. Print patched signing sections for audit ──────────────────────
      - name: Print patched build.gradle signing sections
        run: |
          echo "=== signingConfigs block ==="
          sed -n '/signingConfigs {/,/^    }/p' android/app/build.gradle
          echo ""
          echo "=== buildTypes block ==="
          sed -n '/buildTypes {/,/^    }/p' android/app/build.gradle

      # ── 13. Gradle permissions ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 14. Build Production AAB using Gradle bundleRelease ───────────────
      - name: Build Android App Bundle (:app:bundleRelease)
        run: |
          cd android
          ./gradlew :app:bundleRelease --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # ── 15. Strict AAB Signature Verification ─────────────────────────────
      #   FAILS the workflow if:
      #   - No AAB file is found
      #   - The AAB is signed with the Android Debug certificate
      #   - The AAB SHA1 does not match the upload keystore SHA1
      - name: Verify AAB Signature (strict — fails on debug cert)
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::No .aab file found in android/app/build/outputs/bundle/release/"
            exit 1
          fi
          echo "Found AAB at: $AAB_FILE"
          echo "AAB_PATH=$AAB_FILE" >> $GITHUB_ENV

          # Extract the signer certificate info
          CERT_INFO=$(keytool -printcert -jarfile "$AAB_FILE" 2>&1) || true
          echo "$CERT_INFO"

          # FAIL if signed with Android Debug certificate
          if echo "$CERT_INFO" | grep -qi "CN=Android Debug"; then
            echo ""
            echo "::error::╔══════════════════════════════════════════════════════════════╗"
            echo "::error::║  SIGNING FAILURE: AAB is signed with Android Debug key!     ║"
            echo "::error::║  The release keystore was NOT applied to the build.          ║"
            echo "::error::╚══════════════════════════════════════════════════════════════╝"
            exit 1
          fi

          # Extract AAB SHA1 and compare with upload keystore SHA1
          AAB_SHA1=$(echo "$CERT_INFO" | grep "SHA1:" | head -1 | sed 's/.*SHA1: *//' | tr -d ' ')
          echo "AAB certificate SHA1:       $AAB_SHA1"
          echo "Upload keystore SHA1:       $UPLOAD_KEYSTORE_SHA1"

          if [ "$AAB_SHA1" != "$UPLOAD_KEYSTORE_SHA1" ]; then
            echo ""
            echo "::error::╔══════════════════════════════════════════════════════════════╗"
            echo "::error::║  SIGNING MISMATCH: AAB SHA1 does not match upload keystore! ║"
            echo "::error::╚══════════════════════════════════════════════════════════════╝"
            exit 1
          fi

          echo ""
          echo "✅ AAB is correctly signed with the production upload keystore."

      # ── 16. Prepare Artifact ─────────────────────────────────────────────
      - name: Copy & Name AAB Artifact
        run: |
          cp "$AAB_PATH" "app-release.aab"
          cp "$AAB_PATH" "CampusShare-Production-v${{ github.run_number }}.aab"
          echo "Prepared app-release.aab and CampusShare-Production-v${{ github.run_number }}.aab"

      # ── 17. Secure cleanup of keystore from runner disk ──────────────────
      - name: Clean up Keystore file
        if: always()
        run: |
          rm -f android/app/release.keystore
          echo "Keystore file removed from runner."

      # ── 18. Upload AAB as downloadable artifact ──────────────────────────
      - name: Upload Production AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusShare-Production-AAB-v${{ github.run_number }}
          path: |
            app-release.aab
            CampusShare-Production-v${{ github.run_number }}.aab
          retention-days: 60

      # ── 19. Release Summary ──────────────────────────────────────────────
      - name: Print Production Summary
        run: |
          echo "## 🚀 Google Play App Bundle (AAB) Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target Store | Build Task |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`app-release.aab\` | Google Play Console | \`:app:bundleRelease\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Next Steps for Google Play Release" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact \`CampusShare-Production-AAB-v${{ github.run_number }}\` from this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the downloaded zip to get \`app-release.aab\`." >> $GITHUB_STEP_SUMMARY
          echo "3. Go to [Google Play Console](https://play.google.com/console) -> **CampusShare**." >> $GITHUB_STEP_SUMMARY
          echo "4. Navigate to **Release > Production** (or **Internal Testing**)." >> $GITHUB_STEP_SUMMARY
          echo "5. Click **Create new release** and upload \`app-release.aab\`." >> $GITHUB_STEP_SUMMARY
